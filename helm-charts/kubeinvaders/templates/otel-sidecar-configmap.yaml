{{- if .Values.otelSidecar.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kubeinvaders.fullname" . }}-otel-sidecar-config
data:
  config.yaml: |
    receivers:
      redis:
        endpoint: {{ .Values.otelSidecar.redisEndpoint }}
        collection_interval: 10s
      nginx:
        endpoint: {{ .Values.otelSidecar.nginxStatusEndpoint }}
        collection_interval: 10s
    processors:
      batch: {}
      resource:
        attributes:
          - key: app
            value: {{ .Values.otelSidecar.app }}
            action: upsert
          - key: environment
            value: {{ .Values.otelSidecar.environment }}
            action: upsert
    exporters:
      signalfx:
        access_token: ${env:SPLUNK_ACCESS_TOKEN}
        realm: {{ .Values.otelSidecar.realm }}
    service:
      pipelines:
        metrics:
          receivers: [redis, nginx]
          processors: [resource, batch]
          exporters: [signalfx]
{{- end }}
